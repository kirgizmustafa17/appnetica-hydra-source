name: Update Appnetica Source

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Force full scan (ignore cache)'
        required: false
        type: boolean
        default: false
      concurrency:
        description: 'Concurrency level'
        required: false
        type: number
        default: 15

# Allow only one concurrent update run
concurrency:
  group: update-source
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m pytest tests/

      - name: Execute Scraper
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.full_scan }}" = "true" ]; then
            EXTRA_FLAGS="--full-scan"
          fi
          CONC="${{ inputs.concurrency }}"
          if [ -z "$CONC" ]; then
            CONC=15
          fi
          python -m scraper.main --concurrency "$CONC" $EXTRA_FLAGS

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appnetica.json .cache.json
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "chore: automated catalog update [skip ci]"
            git push
          fi

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p _site
          cp appnetica.json _site/
          if [ -f index.html ]; then
            cp index.html _site/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
